<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="burlapGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#EADDC4" />
      <stop offset="50%" stop-color="#DAC7A5" />
      <stop offset="100%" stop-color="#C2AE88" />
    </radialGradient>
    <linearGradient id="macroGrainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C4" />
      <stop offset="40%" stop-color="#EDB853" />
      <stop offset="85%" stop-color="#A8751B" />
      <stop offset="100%" stop-color="#6E4809" />
    </linearGradient>
  </defs>

  <!-- Burlap / Linen Weave Texture Background -->
  <rect width="600" height="600" fill="url(#burlapGrad)" />

  <!-- Macro Burlap Weft and Warp lines -->
  <g stroke="#B8A480" stroke-width="1.5" opacity="0.45">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="130" x2="600" y2="130" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="270" x2="600" y2="270" />
    <line x1="0" y1="340" x2="600" y2="340" />
    <line x1="0" y1="410" x2="600" y2="410" />
    <line x1="0" y1="480" x2="600" y2="480" />
    <line x1="0" y1="550" x2="600" y2="550" />
    <line x1="60" y1="0" x2="60" y2="600" />
    <line x1="140" y1="0" x2="140" y2="600" />
    <line x1="220" y1="0" x2="220" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="380" y1="0" x2="380" y2="600" />
    <line x1="460" y1="0" x2="460" y2="600" />
    <line x1="540" y1="0" x2="540" y2="600" />
  </g>

  <!-- Soft Depth of Field Grain Shadow -->
  <ellipse cx="300" cy="380" rx="240" ry="120" fill="#473419" opacity="0.25" />

  <!-- Large Macro Stalk Across Background -->
  <path d="M -20 180 Q 250 140 620 40" stroke="#C79F44" stroke-width="8" fill="none" stroke-linecap="round" />
  <g fill="url(#macroGrainGrad)" stroke="#8F6317" stroke-width="1.5">
    <ellipse cx="140" cy="160" rx="26" ry="12" transform="rotate(-15 140 160)" />
    <ellipse cx="200" cy="148" rx="26" ry="12" transform="rotate(25 200 148)" />
    <ellipse cx="260" cy="136" rx="26" ry="12" transform="rotate(-15 260 136)" />
    <ellipse cx="320" cy="120" rx="26" ry="12" transform="rotate(20 320 120)" />
    <ellipse cx="380" cy="100" rx="24" ry="11" transform="rotate(-15 380 100)" />
    <!-- Fine Awns -->
    <line x1="130" y1="150" x2="70" y2="80" stroke="#C79F44" stroke-width="2" />
    <line x1="190" y1="135" x2="150" y2="60" stroke="#C79F44" stroke-width="2" />
    <line x1="250" y1="120" x2="220" y2="40" stroke="#C79F44" stroke-width="2" />
    <line x1="310" y1="105" x2="290" y2="20" stroke="#C79F44" stroke-width="2" />
  </g>

  <!-- Macro Unpolished Golden Wheat Grains in High Definition Foreground -->
  <g>
    <!-- Grain 1 -->
    <g transform="translate(180, 310) rotate(-25)">
      <ellipse cx="0" cy="0" rx="34" ry="18" fill="url(#macroGrainGrad)" stroke="#8A5A14" stroke-width="2" />
      <!-- Central Crease -->
      <path d="M -26 0 Q 0 4 26 0" stroke="#5E3804" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="-8" cy="-6" rx="14" ry="4" fill="#FFFBE8" opacity="0.6" />
    </g>

    <!-- Grain 2 -->
    <g transform="translate(260, 360) rotate(15)">
      <ellipse cx="0" cy="0" rx="38" ry="20" fill="url(#macroGrainGrad)" stroke="#8A5A14" stroke-width="2" />
      <path d="M -28 0 Q 0 4 28 0" stroke="#5E3804" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <ellipse cx="-10" cy="-6" rx="16" ry="5" fill="#FFFBE8" opacity="0.65" />
    </g>

    <!-- Grain 3 -->
    <g transform="translate(350, 330) rotate(-40)">
      <ellipse cx="0" cy="0" rx="36" ry="19" fill="url(#macroGrainGrad)" stroke="#8A5A14" stroke-width="2" />
      <path d="M -27 0 Q 0 4 27 0" stroke="#5E3804" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="-8" cy="-6" rx="15" ry="4" fill="#FFFBE8" opacity="0.6" />
    </g>

    <!-- Grain 4 -->
    <g transform="translate(430, 390) rotate(30)">
      <ellipse cx="0" cy="0" rx="34" ry="18" fill="url(#macroGrainGrad)" stroke="#8A5A14" stroke-width="2" />
      <path d="M -25 0 Q 0 4 25 0" stroke="#5E3804" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="-8" cy="-6" rx="14" ry="4" fill="#FFFBE8" opacity="0.6" />
    </g>

    <!-- Grain 5 -->
    <g transform="translate(200, 440) rotate(35)">
      <ellipse cx="0" cy="0" rx="35" ry="18" fill="url(#macroGrainGrad)" stroke="#8A5A14" stroke-width="2" />
      <path d="M -26 0 Q 0 3 26 0" stroke="#5E3804" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="-8" cy="-6" rx="14" ry="4" fill="#FFFBE8" opacity="0.6" />
    </g>

    <!-- Grain 6 -->
    <g transform="translate(300, 460) rotate(-10)">
      <ellipse cx="0" cy="0" rx="37" ry="19" fill="url(#macroGrainGrad)" stroke="#8A5A14" stroke-width="2" />
      <path d="M -28 0 Q 0 4 28 0" stroke="#5E3804" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="-9" cy="-6" rx="15" ry="5" fill="#FFFBE8" opacity="0.6" />
    </g>

    <!-- Grain 7 -->
    <g transform="translate(390, 470) rotate(-30)">
      <ellipse cx="0" cy="0" rx="34" ry="18" fill="url(#macroGrainGrad)" stroke="#8A5A14" stroke-width="2" />
      <path d="M -25 0 Q 0 3 25 0" stroke="#5E3804" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="-8" cy="-6" rx="14" ry="4" fill="#FFFBE8" opacity="0.6" />
    </g>
  </g>
</svg>
