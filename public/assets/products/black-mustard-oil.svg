<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background: Dark forest green and warm slate stone backdrop -->
    <linearGradient id="bgBlackMustard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193325" />
      <stop offset="50%" stop-color="#24382C" />
      <stop offset="100%" stop-color="#16221B" />
    </linearGradient>

    <!-- Warm Directional Keylight -->
    <linearGradient id="keyLightOil" x1="10%" y1="0%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#F2E8D3" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#16221B" stop-opacity="0" />
    </linearGradient>

    <!-- Deep Golden Amber Black Mustard Oil -->
    <linearGradient id="blackOilLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C640" />
      <stop offset="40%" stop-color="#D99411" />
      <stop offset="85%" stop-color="#995E05" />
      <stop offset="100%" stop-color="#5E3802" />
    </linearGradient>

    <!-- Clear Unlabelled Glass Bottle Glare -->
    <linearGradient id="bottleGlassGlare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45" />
    </linearGradient>

    <!-- Black Mustard Seed Gradient -->
    <radialGradient id="blackSeedGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4A3B32" />
      <stop offset="45%" stop-color="#261A14" />
      <stop offset="100%" stop-color="#0F0805" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgBlackMustard)" />
  <rect width="600" height="600" fill="url(#keyLightOil)" />

  <!-- Natural dark timber table surface -->
  <path d="M 0 430 L 600 410 L 600 600 L 0 600 Z" fill="#1C1813" />
  <path d="M 0 430 L 600 410" stroke="#332B22" stroke-width="2" />
  <path d="M 0 480 L 600 460" stroke="#262019" stroke-width="1.5" />

  <!-- Natural dark slate board resting on timber -->
  <polygon points="60,460 540,435 560,540 40,565" fill="#222B27" stroke="#37453F" stroke-width="2" />

  <!-- Bottle Grounding Shadow -->
  <ellipse cx="260" cy="485" rx="90" ry="24" fill="#0A0E0C" opacity="0.75" />

  <!-- UNLABELLED CLEAR GLASS BOTTLE OF BLACK MUSTARD OIL -->
  <!-- Back Glass Structure -->
  <path d="M 230 140 L 290 140 L 305 210 Q 340 230 340 270 L 340 460 Q 340 480 320 480 L 200 480 Q 180 480 180 460 L 180 270 Q 180 230 215 210 Z" fill="#3B4F44" opacity="0.3" />

  <!-- Golden Amber Oil Body -->
  <path d="M 215 250 L 305 250 L 328 280 L 328 460 Q 328 472 312 472 L 208 472 Q 192 472 192 460 L 192 280 Z" fill="url(#blackOilLiquid)" />
  <!-- Surface Meniscus -->
  <ellipse cx="260" cy="252" rx="45" ry="10" fill="#F4C640" opacity="0.9" />

  <!-- Unlabelled Glass Glare & Reflections -->
  <path d="M 230 140 L 290 140 L 305 210 Q 340 230 340 270 L 340 460 Q 340 480 320 480 L 200 480 Q 180 480 180 460 L 180 270 Q 180 230 215 210 Z" fill="url(#bottleGlassGlare)" stroke="#5E786B" stroke-width="1.5" />

  <!-- Refined Vertical Glass Highlights -->
  <path d="M 198 275 L 198 455" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7" />
  <path d="M 207 285 L 207 445" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <path d="M 322 275 L 322 455" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.35" />

  <!-- Clean Wooden Cork / Stopper -->
  <rect x="238" y="115" width="44" height="28" rx="6" fill="#A87B4B" stroke="#6E4D2A" stroke-width="1.5" />
  <line x1="242" y1="126" x2="278" y2="126" stroke="#C99B69" stroke-width="1.5" />

  <!-- SCATTERED WHOLE BLACK MUSTARD SEEDS (Distinct, realistic botanical detail) -->
  <!-- Small Earthen Ramekin / Tasting Dish of Black Mustard Seeds -->
  <ellipse cx="420" cy="495" rx="75" ry="26" fill="#141E19" stroke="#374B40" stroke-width="3" />
  <ellipse cx="420" cy="492" rx="68" ry="20" fill="#1E1712" />

  <!-- Mounded Seeds Inside Dish -->
  <g>
    <!-- Cluster in dish -->
    <circle cx="395" cy="485" r="4.5" fill="url(#blackSeedGrad)" />
    <circle cx="408" cy="482" r="5" fill="url(#blackSeedGrad)" />
    <circle cx="420" cy="480" r="5.5" fill="url(#blackSeedGrad)" />
    <circle cx="432" cy="483" r="5" fill="url(#blackSeedGrad)" />
    <circle cx="445" cy="486" r="4.5" fill="url(#blackSeedGrad)" />

    <circle cx="385" cy="492" r="5" fill="url(#blackSeedGrad)" />
    <circle cx="400" cy="490" r="5.5" fill="url(#blackSeedGrad)" />
    <circle cx="414" cy="488" r="6" fill="url(#blackSeedGrad)" />
    <circle cx="428" cy="490" r="5.5" fill="url(#blackSeedGrad)" />
    <circle cx="440" cy="492" r="5" fill="url(#blackSeedGrad)" />
    <circle cx="452" cy="494" r="4.5" fill="url(#blackSeedGrad)" />

    <circle cx="395" cy="498" r="5" fill="url(#blackSeedGrad)" />
    <circle cx="410" cy="496" r="5.5" fill="url(#blackSeedGrad)" />
    <circle cx="425" cy="497" r="5.5" fill="url(#blackSeedGrad)" />
    <circle cx="438" cy="498" r="5" fill="url(#blackSeedGrad)" />
  </g>

  <!-- Loose Scattered Seeds on the Slate in the Foreground -->
  <g>
    <circle cx="150" cy="495" r="4" fill="url(#blackSeedGrad)" />
    <circle cx="162" cy="502" r="3.5" fill="url(#blackSeedGrad)" />
    <circle cx="178" cy="492" r="4.2" fill="url(#blackSeedGrad)" />
    <circle cx="185" cy="510" r="3.8" fill="url(#blackSeedGrad)" />
    <circle cx="330" cy="500" r="4.5" fill="url(#blackSeedGrad)" />
    <circle cx="345" cy="492" r="4" fill="url(#blackSeedGrad)" />
    <circle cx="355" cy="505" r="3.8" fill="url(#blackSeedGrad)" />
    <circle cx="475" cy="515" r="4" fill="url(#blackSeedGrad)" />
    <circle cx="488" cy="508" r="3.5" fill="url(#blackSeedGrad)" />
    <circle cx="502" cy="520" r="4.2" fill="url(#blackSeedGrad)" />
  </g>
</svg>
