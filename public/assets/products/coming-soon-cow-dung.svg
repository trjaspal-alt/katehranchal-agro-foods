  <ellipse cx="200" cy="270" rx="90" ry="34" fill="#7A6047" stroke="#523E2C" stroke-width="2.5" />
  <ellipse cx="200" cy="265" rx="82" ry="26" fill="#8C7054" />
  <!-- Cake 2 (Middle) -->
  <ellipse cx="200" cy="235" rx="85" ry="32" fill="#7A6047" stroke="#523E2C" stroke-width="2.5" />
  <ellipse cx="200" cy="230" rx="76" ry="24" fill="#94785C" />
  <!-- Cake 3 (Top) -->
  <ellipse cx="200" cy="200" rx="80" ry="30" fill="#7A6047" stroke="#523E2C" stroke-width="2.5" />
  <ellipse cx="200" cy="195" rx="72" ry="22" fill="#A18466" />
  <!-- Natural Fiber Texture -->
  <circle cx="170" cy="195" r="4" fill="#6E543C" />
