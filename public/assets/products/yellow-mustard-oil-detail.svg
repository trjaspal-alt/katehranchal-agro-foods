<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="ivoryStoneGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FCF9F2" />
      <stop offset="60%" stop-color="#F2EADA" />
      <stop offset="100%" stop-color="#DECDB7" />
    </radialGradient>
    <radialGradient id="yellowSeedMacro" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF0A3" />
      <stop offset="40%" stop-color="#F2C238" />
      <stop offset="100%" stop-color="#A87508" />
    </radialGradient>
    <linearGradient id="yellowOilDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="40%" stop-color="#F7C934" />
      <stop offset="100%" stop-color="#C78906" />
    </linearGradient>
  </defs>

  <!-- Warm Ivory Stone Surface -->
  <rect width="600" height="600" fill="url(#ivoryStoneGrad)" />

  <!-- Soft stone fissures -->
  <g stroke="#D4C5B0" stroke-width="1.2" opacity="0.5">
    <path d="M 0 160 Q 240 180 600 150" />
    <path d="M 0 310 Q 320 290 600 330" />
    <path d="M 0 460 Q 200 480 600 450" />
  </g>

  <!-- Clear Glass Cruet Spout Pouring Oil (From Top Right) -->
  <path d="M 450 -40 L 650 -40 L 520 180 Q 460 220 380 180 L 400 100 Z" fill="#EAE0D0" opacity="0.4" stroke="#FFFFFF" stroke-width="2" />
  <path d="M 470 -20 L 630 -20 L 500 170 Q 450 200 390 170 Z" fill="url(#yellowOilDrop)" opacity="0.85" />
  <path d="M 430 110 L 520 40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.75" />

  <!-- Stream & Golden Droplet -->
  <path d="M 400 190 Q 370 240 350 300 C 350 320 330 330 315 330 C 300 330 290 320 290 300 Q 310 240 370 190 Z" fill="url(#yellowOilDrop)" />
  <ellipse cx="308" cy="315" rx="8" ry="4" fill="#FFFFFF" opacity="0.8" />

  <!-- Golden Pool on Stone -->
  <ellipse cx="270" cy="430" rx="160" ry="45" fill="#F7C934" opacity="0.2" />
  <ellipse cx="270" cy="430" rx="100" ry="28" fill="#F7C934" opacity="0.3" />
  <ellipse cx="270" cy="430" rx="55" ry="14" fill="url(#yellowOilDrop)" opacity="0.85" />
  <ellipse cx="265" cy="428" rx="16" ry="4" fill="#FFFFFF" opacity="0.7" />

  <!-- High-Definition Macro Whole Yellow Mustard Seeds -->
  <g>
    <circle cx="120" cy="430" r="16" fill="url(#yellowSeedMacro)" />
    <circle cx="115" cy="425" r="3.5" fill="#FFFCE6" opacity="0.7" />

    <circle cx="155" cy="455" r="14" fill="url(#yellowSeedMacro)" />
    <circle cx="150" cy="450" r="3" fill="#FFFCE6" opacity="0.7" />

    <circle cx="190" cy="490" r="18" fill="url(#yellowSeedMacro)" />
    <circle cx="184" cy="484" r="4" fill="#FFFCE6" opacity="0.7" />

    <circle cx="235" cy="505" r="15" fill="url(#yellowSeedMacro)" />
    <circle cx="230" cy="500" r="3" fill="#FFFCE6" opacity="0.7" />

    <circle cx="340" cy="490" r="17" fill="url(#yellowSeedMacro)" />
    <circle cx="334" cy="485" r="3.5" fill="#FFFCE6" opacity="0.7" />

    <circle cx="380" cy="460" r="19" fill="url(#yellowSeedMacro)" />
    <circle cx="374" cy="454" r="4" fill="#FFFCE6" opacity="0.7" />

    <circle cx="425" cy="430" r="15" fill="url(#yellowSeedMacro)" />
    <circle cx="420" cy="425" r="3" fill="#FFFCE6" opacity="0.7" />

    <circle cx="460" cy="475" r="16" fill="url(#yellowSeedMacro)" />
    <circle cx="455" cy="470" r="3.5" fill="#FFFCE6" opacity="0.7" />

    <circle cx="410" cy="520" r="14" fill="url(#yellowSeedMacro)" />
    <circle cx="300" cy="535" r="16" fill="url(#yellowSeedMacro)" />
    <circle cx="140" cy="525" r="15" fill="url(#yellowSeedMacro)" />
  </g>
</svg>
