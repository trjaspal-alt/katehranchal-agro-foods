<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="slateGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2D3A33" />
      <stop offset="60%" stop-color="#1E2822" />
      <stop offset="100%" stop-color="#111713" />
    </radialGradient>
    <radialGradient id="seedMacro" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#544439" />
      <stop offset="35%" stop-color="#261C16" />
      <stop offset="100%" stop-color="#0A0604" />
    </radialGradient>
    <linearGradient id="oilDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD969" />
      <stop offset="50%" stop-color="#E0980B" />
      <stop offset="100%" stop-color="#8C5302" />
    </linearGradient>
  </defs>

  <!-- Dark Slate Background -->
  <rect width="600" height="600" fill="url(#slateGrad)" />

  <!-- Slate mineral grain lines -->
  <g stroke="#3E4F46" stroke-width="1" opacity="0.4">
    <path d="M 0 120 Q 200 130 600 110" />
    <path d="M 0 250 Q 300 270 600 240" />
    <path d="M 0 380 Q 250 395 600 375" />
    <path d="M 0 510 Q 350 520 600 500" />
  </g>

  <!-- Large Macro Pouring Crucible / Glass Rim at Top Left -->
  <path d="M -50 -50 L 320 -50 L 250 200 Q 180 260 80 220 L -50 140 Z" fill="#1C2E24" opacity="0.4" stroke="#486353" stroke-width="3" />
  <path d="M -30 -30 L 290 -30 L 230 180 Q 170 230 70 200 L -30 130 Z" fill="url(#oilDrop)" opacity="0.85" />
  <path d="M 50 40 L 210 160" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- A Suspended Golden Oil Droplet -->
  <path d="M 230 220 C 230 220 250 270 250 285 C 250 300 238 310 225 310 C 212 310 200 300 200 285 C 200 270 220 220 220 220 Z" fill="url(#oilDrop)" />
  <ellipse cx="220" cy="288" rx="8" ry="4" fill="#FFFFFF" opacity="0.75" />

  <!-- Natural Ripple on Stone Surface -->
  <ellipse cx="320" cy="440" rx="140" ry="40" fill="#E0980B" opacity="0.15" />
  <ellipse cx="320" cy="440" rx="90" ry="25" fill="#E0980B" opacity="0.25" />
  <ellipse cx="320" cy="440" rx="45" ry="12" fill="url(#oilDrop)" opacity="0.8" />
  <ellipse cx="316" cy="438" rx="14" ry="4" fill="#FFFFFF" opacity="0.6" />

  <!-- High-Definition Macro Whole Black Mustard Seeds scattered in foreground -->
  <g>
    <circle cx="160" cy="420" r="16" fill="url(#seedMacro)" />
    <circle cx="155" cy="415" r="3" fill="#8A766A" opacity="0.6" />

    <circle cx="195" cy="445" r="14" fill="url(#seedMacro)" />
    <circle cx="190" cy="440" r="2.5" fill="#8A766A" opacity="0.6" />

    <circle cx="230" cy="480" r="18" fill="url(#seedMacro)" />
    <circle cx="224" cy="474" r="3.5" fill="#8A766A" opacity="0.6" />

    <circle cx="275" cy="495" r="15" fill="url(#seedMacro)" />
    <circle cx="270" cy="490" r="3" fill="#8A766A" opacity="0.6" />

    <circle cx="370" cy="475" r="17" fill="url(#seedMacro)" />
    <circle cx="364" cy="470" r="3.2" fill="#8A766A" opacity="0.6" />

    <circle cx="410" cy="450" r="19" fill="url(#seedMacro)" />
    <circle cx="404" cy="444" r="3.8" fill="#8A766A" opacity="0.6" />

    <circle cx="450" cy="420" r="15" fill="url(#seedMacro)" />
    <circle cx="445" cy="415" r="3" fill="#8A766A" opacity="0.6" />

    <circle cx="485" cy="460" r="16" fill="url(#seedMacro)" />
    <circle cx="480" cy="455" r="3" fill="#8A766A" opacity="0.6" />

    <circle cx="390" cy="515" r="14" fill="url(#seedMacro)" />
    <circle cx="340" cy="530" r="16" fill="url(#seedMacro)" />
    <circle cx="180" cy="520" r="15" fill="url(#seedMacro)" />
  </g>
</svg>
