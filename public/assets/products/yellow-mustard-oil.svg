<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background: Lighter warm ivory stone setting with soft ambient sunlight -->
    <linearGradient id="bgYellowMustard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EE" />
      <stop offset="50%" stop-color="#F2ECE0" />
      <stop offset="100%" stop-color="#E2D7C3" />
    </linearGradient>

    <!-- Warm Ambient Keylight -->
    <linearGradient id="softWarmGlow" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E2D7C3" stop-opacity="0" />
    </linearGradient>

    <!-- Bright Luminous Golden Yellow Mustard Oil -->
    <linearGradient id="yellowOilLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="35%" stop-color="#F7C934" />
      <stop offset="75%" stop-color="#E5A610" />
      <stop offset="100%" stop-color="#BD7E05" />
    </linearGradient>

    <!-- Clear Tall Bottle Glass Glare -->
    <linearGradient id="tallBottleGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5" />
    </linearGradient>

    <!-- Yellow Mustard Seed Radial Gradient -->
    <radialGradient id="yellowSeedGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="50%" stop-color="#E5B229" />
      <stop offset="100%" stop-color="#9C6F0A" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgYellowMustard)" />
  <rect width="600" height="600" fill="url(#softWarmGlow)" />

  <!-- Warm Ivory Stone Slab Base -->
  <path d="M 30 440 L 570 420 L 590 570 L 10 590 Z" fill="#EADFCF" stroke="#D8C8B2" stroke-width="2" />
  <path d="M 50 455 L 550 435" stroke="#F5EDE1" stroke-width="2" />

  <!-- Soft Shadow for Tall Cylindrical Bottle -->
  <ellipse cx="320" cy="475" rx="80" ry="20" fill="#756149" opacity="0.25" />
  <ellipse cx="320" cy="472" rx="60" ry="12" fill="#3B2E1F" opacity="0.2" />

  <!-- DISTINCT COMPOSITION: TALL SLENDER CYLINDRICAL UNLABELLED GLASS BOTTLE WITH POUR SPOUT -->
  <!-- Glass Body Back -->
  <rect x="250" y="160" width="140" height="310" rx="20" fill="#E8DEC8" opacity="0.5" />

  <!-- Bright Golden Oil Content -->
  <rect x="258" y="200" width="124" height="264" rx="14" fill="url(#yellowOilLiquid)" />
  <ellipse cx="320" cy="202" rx="62" ry="12" fill="#FFE066" opacity="0.9" />

  <!-- Glass Body Front Reflection (Unlabelled, sleek modern culinary glass) -->
  <rect x="250" y="160" width="140" height="310" rx="20" fill="url(#tallBottleGlass)" stroke="#FFFFFF" stroke-width="1.8" />
  <!-- Refined Crisp Highlight Strip -->
  <path d="M 266 175 L 266 455" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 276 190 L 276 445" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.45" />
  <path d="M 374 180 L 374 455" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.35" />

  <!-- Slender Bottle Neck & Stainless/Cork Pour Spout -->
  <rect x="295" y="115" width="50" height="48" rx="6" fill="#F4EDE2" stroke="#FFFFFF" stroke-width="1.5" />
  <!-- Traditional Wooden / Cork Stopper -->
  <rect x="290" y="90" width="60" height="28" rx="8" fill="#C49A62" stroke="#8A602B" stroke-width="1.5" />
  <line x1="295" y1="102" x2="345" y2="102" stroke="#DFC091" stroke-width="1.5" />

  <!-- DISTINCT FOREGROUND: NATURAL TERRACOTTA / STONE BOWL WITH YELLOW MUSTARD SEEDS -->
  <ellipse cx="170" cy="485" rx="72" ry="24" fill="#6E5640" opacity="0.3" />
  <ellipse cx="170" cy="480" rx="68" ry="22" fill="#D4A779" stroke="#9E6E3C" stroke-width="2.5" />
  <ellipse cx="170" cy="477" rx="60" ry="17" fill="#8A5A2B" />

  <!-- Yellow Mustard Seeds in Bowl -->
  <g>
    <circle cx="145" cy="474" r="4.5" fill="url(#yellowSeedGrad)" />
    <circle cx="156" cy="471" r="5" fill="url(#yellowSeedGrad)" />
    <circle cx="168" cy="470" r="5.5" fill="url(#yellowSeedGrad)" />
    <circle cx="180" cy="472" r="5" fill="url(#yellowSeedGrad)" />
    <circle cx="192" cy="475" r="4.5" fill="url(#yellowSeedGrad)" />

    <circle cx="138" cy="480" r="5" fill="url(#yellowSeedGrad)" />
    <circle cx="150" cy="478" r="5.5" fill="url(#yellowSeedGrad)" />
    <circle cx="164" cy="476" r="6" fill="url(#yellowSeedGrad)" />
    <circle cx="178" cy="478" r="5.5" fill="url(#yellowSeedGrad)" />
    <circle cx="190" cy="480" r="5" fill="url(#yellowSeedGrad)" />
    <circle cx="200" cy="482" r="4.5" fill="url(#yellowSeedGrad)" />

    <circle cx="152" cy="485" r="5" fill="url(#yellowSeedGrad)" />
    <circle cx="168" cy="484" r="5.5" fill="url(#yellowSeedGrad)" />
    <circle cx="182" cy="485" r="5" fill="url(#yellowSeedGrad)" />
  </g>

  <!-- Loose Scattered Yellow Seeds Across Warm Stone -->
  <g>
    <circle cx="225" cy="485" r="4.5" fill="url(#yellowSeedGrad)" />
    <circle cx="238" cy="478" r="4" fill="url(#yellowSeedGrad)" />
    <circle cx="250" cy="492" r="4.2" fill="url(#yellowSeedGrad)" />
    <circle cx="410" cy="480" r="4.5" fill="url(#yellowSeedGrad)" />
    <circle cx="425" cy="474" r="3.8" fill="url(#yellowSeedGrad)" />
    <circle cx="438" cy="485" r="4.2" fill="url(#yellowSeedGrad)" />
    <circle cx="452" cy="478" r="4" fill="url(#yellowSeedGrad)" />
    <circle cx="465" cy="488" r="3.5" fill="url(#yellowSeedGrad)" />
  </g>
</svg>
