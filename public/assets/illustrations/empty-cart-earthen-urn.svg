<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" role="img" aria-label="Editorial illustration of a traditional earthen storage vessel with wheat stalk">
  <defs>
    <radialGradient id="urn-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="80%" stop-color="#F5EFE3"/>
      <stop offset="100%" stop-color="#EBE1D0"/>
    </radialGradient>
    <radialGradient id="urn-clay" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D98A68"/>
      <stop offset="60%" stop-color="#B26543"/>
      <stop offset="100%" stop-color="#7A3C22"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="12" fill="url(#urn-bg)"/>

  <!-- Subtle floor shadow ellipse -->
  <ellipse cx="200" cy="305" rx="85" ry="14" fill="#5C4033" opacity="0.15"/>

  <!-- Traditional Earthen Urn / Vessel Form -->
  <!-- Neck and rim -->
  <ellipse cx="200" cy="180" rx="42" ry="10" fill="#B26543" stroke="#231F19" stroke-width="1.5"/>
  <ellipse cx="200" cy="178" rx="34" ry="7" fill="#8A4526"/>
  <!-- Belly of the urn -->
  <path d="M 162 184 C 130 220 140 280 170 298 C 190 305 210 305 230 298 C 260 280 270 220 238 184 Z" 
        fill="url(#urn-clay)" stroke="#231F19" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Decorative hand-painted white village slip bands -->
  <path d="M 152 230 Q 200 245 248 230" stroke="#FBF9F4" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 156 242 Q 200 257 244 242" stroke="#FBF9F4" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="3 4" opacity="0.85"/>

  <!-- Single Golden Wheat Stalk Leaning Gracefully Beside Urn -->
  <g stroke="#231F19" stroke-width="1.4" fill="none">
    <path d="M 270 300 Q 285 220 255 130"/>
    <!-- Wheat Grains -->
    <ellipse cx="258" cy="138" rx="8" ry="4" transform="rotate(-30 258 138)" fill="#E0980B"/>
    <ellipse cx="248" cy="126" rx="8" ry="4" transform="rotate(-40 248 126)" fill="#E0980B"/>
    <ellipse cx="266" cy="122" rx="8" ry="4" transform="rotate(-15 266 122)" fill="#E0980B"/>
    <ellipse cx="254" cy="110" rx="8" ry="4" transform="rotate(-35 254 110)" fill="#E0980B"/>
    <line x1="248" y1="126" x2="232" y2="105" stroke="#231F19" stroke-width="1"/>
    <line x1="266" y1="122" x2="282" y2="98" stroke="#231F19" stroke-width="1"/>
    <line x1="254" y1="110" x2="245" y2="82" stroke="#231F19" stroke-width="1"/>
  </g>

  <!-- Small Mustard Seed Pile At Base -->
  <g fill="#D49A24" stroke="#231F19" stroke-width="0.8">
    <circle cx="160" cy="298" r="3"/>
    <circle cx="152" cy="301" r="2.8"/>
    <circle cx="165" cy="303" r="3.2"/>
    <circle cx="158" cy="305" r="2.5"/>
  </g>
</svg>
