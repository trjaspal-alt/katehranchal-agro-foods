<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="100%" height="100%" fill="none" role="img" aria-label="Editorial illustration of farm to home journey">
  <defs>
    <linearGradient id="fth-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF7"/>
      <stop offset="60%" stop-color="#F7F1E6"/>
      <stop offset="100%" stop-color="#ECE3D2"/>
    </linearGradient>

    <radialGradient id="fth-glow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FDE8B5" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F7D897" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F7F1E6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="675" fill="url(#fth-bg)"/>

  <!-- Quiet Morning Sun Over Village Fields -->
  <circle cx="220" cy="210" r="100" fill="url(#fth-glow)"/>
  <circle cx="220" cy="210" r="42" fill="#F8DE9E" opacity="0.95"/>

  <!-- Left: Village Landscape & Furrows (The Source) -->
  <g opacity="0.85">
    <!-- Village hut simplified geometric form -->
    <path d="M 120 340 L 170 300 L 220 340 Z" fill="#A4644A" stroke="#231F19" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="135" y="340" width="70" height="50" fill="#EADCC7" stroke="#231F19" stroke-width="1.5"/>
    <rect x="160" y="360" width="20" height="30" fill="#6B412B"/>
    <!-- Tree canopy -->
    <circle cx="250" cy="320" r="32" fill="#3D5A45" stroke="#231F19" stroke-width="1.5"/>
    <line x1="250" y1="352" x2="250" y2="385" stroke="#231F19" stroke-width="2"/>
  </g>

  <!-- Agricultural Furrows & Layered Earth (Curves toward Right) -->
  <path d="M 0 390 Q 200 370 420 420 Q 640 470 900 430 L 900 675 L 0 675 Z" fill="#2E4A35"/>
  <path d="M 0 450 Q 240 430 480 475 Q 720 520 900 485 L 900 675 L 0 675 Z" fill="#1C3022"/>
  <path d="M 0 540 Q 300 510 560 560 Q 760 600 900 565 L 900 675 L 0 675 Z" fill="#132017"/>

  <!-- Winding Path from Rural Origin to Modern Hearth -->
  <path d="M 170 390 C 230 460 320 510 450 500 C 580 490 670 410 750 370 L 780 370 C 700 415 600 510 460 520 C 310 530 210 470 150 390 Z" fill="#C9986D" opacity="0.9"/>

  <!-- Right: Modern Home Table & Brass Jar (The Destination) -->
  <g transform="translate(620, 240)">
    <!-- Contemporary clean architectural window frame -->
    <rect x="20" y="0" width="160" height="150" rx="80" ry="80" fill="#FFF9ED" stroke="#231F19" stroke-width="1.5" opacity="0.9"/>
    <line x1="100" y1="0" x2="100" y2="150" stroke="#231F19" stroke-width="1.2" opacity="0.6"/>
    <line x1="20" y1="75" x2="180" y2="75" stroke="#231F19" stroke-width="1.2" opacity="0.6"/>

    <!-- Polished brass / earthen jar (Village food in modern home) -->
    <ellipse cx="100" cy="190" rx="42" ry="14" fill="#A87720"/>
    <path d="M 64 188 Q 58 240 76 270 Q 100 280 124 270 Q 142 240 136 188 Z" fill="#D99E26" stroke="#231F19" stroke-width="1.5"/>
    <ellipse cx="100" cy="188" rx="36" ry="10" fill="#F5C864" stroke="#231F19" stroke-width="1.2"/>
    <!-- Lid knob -->
    <circle cx="100" cy="178" r="6" fill="#8B5E14" stroke="#231F19" stroke-width="1.2"/>
    <!-- Table ledge -->
    <line x1="-10" y1="275" x2="210" y2="275" stroke="#231F19" stroke-width="2"/>
  </g>

  <!-- Flowing Wheat Stalks bridging the two worlds -->
  <g stroke="#231F19" stroke-width="1.5" fill="none">
    <path d="M 380 500 Q 420 400 480 340"/>
    <!-- Grains on the arch -->
    <ellipse cx="468" cy="355" rx="10" ry="5" transform="rotate(-40 468 355)" fill="#E0980B"/>
    <ellipse cx="488" cy="340" rx="10" ry="5" transform="rotate(-30 488 340)" fill="#E0980B"/>
    <ellipse cx="508" cy="330" rx="10" ry="5" transform="rotate(-15 508 330)" fill="#E0980B"/>
  </g>
</svg>
