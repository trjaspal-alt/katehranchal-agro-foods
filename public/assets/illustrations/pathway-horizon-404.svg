<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none" role="img" aria-label="Editorial illustration of a winding village path towards the sunrise horizon">
  <defs>
    <linearGradient id="p404-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="60%" stop-color="#F5EFE3"/>
      <stop offset="100%" stop-color="#EAE0CE"/>
    </linearGradient>
    <radialGradient id="p404-sun" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#FCE4AA" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F7D897" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FCFAF5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#p404-bg)"/>

  <!-- Morning Sun Disc on the Far Horizon -->
  <circle cx="300" cy="180" r="90" fill="url(#p404-sun)"/>
  <circle cx="300" cy="180" r="34" fill="#F8DE9E" opacity="0.9"/>

  <!-- Soft Distant Tree Line -->
  <path d="M 120 225 Q 160 205 200 225 Q 240 210 280 225 L 280 235 L 120 235 Z" fill="#2E4A35" opacity="0.4"/>
  <path d="M 320 225 Q 360 208 400 225 Q 440 205 480 225 L 480 235 L 320 235 Z" fill="#2E4A35" opacity="0.4"/>

  <!-- Layered Cultivated Terraces -->
  <path d="M 0 235 Q 180 225 360 240 Q 500 250 600 230 L 600 400 L 0 400 Z" fill="#5F7354" opacity="0.45"/>
  <path d="M 0 270 Q 220 255 420 285 Q 520 295 600 275 L 600 400 L 0 400 Z" fill="#3D5640" opacity="0.75"/>
  <path d="M 0 320 Q 250 300 480 340 L 600 330 L 600 400 L 0 400 Z" fill="#1C3022"/>

  <!-- Winding Rural Pathway Guiding Traveler Back to Center -->
  <path d="M 230 400 C 270 340 320 310 295 260 C 285 240 298 230 300 225 L 306 225 C 304 230 295 242 305 260 C 335 315 285 345 250 400 Z" 
        fill="#C9986D" opacity="0.95"/>

  <!-- Minimalist Wheat Accent on Side -->
  <g stroke="#1D2A20" stroke-width="1.3" fill="none">
    <path d="M 80 400 Q 95 320 120 270"/>
    <ellipse cx="120" cy="265" rx="6" ry="3" transform="rotate(-30 120 265)" fill="#E0980B"/>
    <ellipse cx="112" cy="255" rx="6" ry="3" transform="rotate(-40 112 255)" fill="#E0980B"/>
    <ellipse cx="128" cy="252" rx="6" ry="3" transform="rotate(-15 128 252)" fill="#E0980B"/>
  </g>
</svg>
